name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Extract and Fix Target Compatibility
      run: |
        unzip -q CarromAimAssistant-Android-Source.zip
        cd CarromAimAssistant
        
        # Align Java target to VERSION_17 matching Kotlin
        sed -i 's/sourceCompatibility = JavaVersion.VERSION_1_8/sourceCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts
        sed -i 's/targetCompatibility = JavaVersion.VERSION_1_8/targetCompatibility = JavaVersion.VERSION_17/g' app/build.gradle.kts
        
        # Ensure gradle.properties skips strict mismatch enforcement if needed
        echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties

    - name: Build Debug APK
      run: |
        cd CarromAimAssistant
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarromAimAssistant-APK
        path: CarromAimAssistant/app/build/outputs/apk/debug/*.apk
