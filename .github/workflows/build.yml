name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.9'

    - name: Extract Project and Fix Gradle Configuration
      run: |
        unzip -q CarromAimAssistant-Android-Source.zip
        cd CarromAimAssistant
        
        # Override JVM targets directly in app/build.gradle.kts
        python3 -c "
        with open('app/build.gradle.kts', 'r') as f:
            content = f.read()
        content = content.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
        content = content.replace('jvmTarget = \"1.8\"', 'jvmTarget = \"17\"')
        with open('app/build.gradle.kts', 'w') as f:
            f.write(content)
        "
        
        # Disable Kotlin strict compiler checks
        echo "kotlin.jvm.target.validation.mode=ignore" >> gradle.properties

    - name: Build Debug APK
      run: |
        cd CarromAimAssistant
        gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CarromAimAssistant-APK
        path: CarromAimAssistant/app/build/outputs/apk/debug/*.apk
